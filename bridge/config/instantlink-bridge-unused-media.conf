# InstantLink Bridge uses SPI ST7789/fbtft and receives camera photos over FTP.
# JPEG/HIF preparation uses CPU image libraries, not the legacy VCHI media API.
# Legacy media services report initialization errors on the 16 MiB GPU profile.
# Suppress only their udev alias autoload; explicit modprobe remains available.
# Keep shared video, framebuffer, SPI, mailbox and Bluetooth drivers enabled.
blacklist bcm2835_v4l2
blacklist bcm2835_codec
blacklist bcm2835_isp
blacklist vc_sm_cma
blacklist snd_bcm2835
